name: deploy-ocr

# Builds the OCR images (api/worker + local ollama) and deploys them to Azure
# Container Apps. Requires the infra repo to have been deployed first.
#
# Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC).
on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  RG: rg-capstone
  LOCATION: eastus
  ACR: capstoneacr0001
  IMAGE_TAG: latest

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: { group: azure-ocr, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build ocr-api (FastAPI + Celery worker image)
        run: az acr build --registry ${{ env.ACR }} --image $ACR.azurecr.io/ocr-api:$IMAGE_TAG --file Dockerfile --context .

      - name: Build ocr-ollama
        run: az acr build --registry ${{ env.ACR }} --image $ACR.azurecr.io/ocr-ollama:$IMAGE_TAG --file Dockerfile.ollama --context .

      - name: Roll ocr-api
        run: az containerapp update -n ocr-api -g "${{ env.RG }}" --image $ACR.azurecr.io/ocr-api:$IMAGE_TAG

      - name: Roll ocr-worker
        run: az containerapp update -n ocr-worker -g "${{ env.RG }}" --image $ACR.azurecr.io/ocr-api:$IMAGE_TAG

      - name: Roll ocr-ollama
        run: az containerapp update -n ocr-ollama -g "${{ env.RG }}" --image $ACR.azurecr.io/ocr-ollama:$IMAGE_TAG